name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish the Homebrew formula for, e.g. v0.1.0"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    if: github.event_name != 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/ppgen
          ls -la "$bin"
          "$bin" -w 4 -n 2
          "$bin" --help >/dev/null

      - name: Package
        run: |
          tar -czf "ppgen-${{ matrix.target }}.tar.gz" \
            -C target/${{ matrix.target }}/release ppgen \
            -C "$GITHUB_WORKSPACE" LICENSE README.md

      - uses: actions/upload-artifact@v7
        with:
          name: ppgen-${{ matrix.target }}
          path: ppgen-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    if: >-
      !cancelled() &&
      (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Update formula in s12v/homebrew-tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set; skipping Homebrew formula update"
            exit 0
          fi
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output SHA256SUMS
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/s12v/homebrew-tap.git" tap
          .github/scripts/render-formula.sh "$version" SHA256SUMS > tap/Formula/ppgen.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ppgen.rb
          if git diff --cached --quiet; then
            git push --dry-run --quiet  # nothing to publish, but make sure the token could
            echo "Formula for $version is already up to date"
            exit 0
          fi
          git commit -m "ppgen $version"
          git push --quiet
